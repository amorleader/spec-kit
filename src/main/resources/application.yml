spring:
  application:
    name: mhr-build-planner

server:
  port: 8080

app:
  ai:
    mode: ${APP_AI_MODE:${AI_MODE:mock}}
    base-url: ${APP_AI_BASE_URL:${AI_BASE_URL:}}
    api-key: ${APP_AI_API_KEY:${AI_API_KEY:}}
    model: ${APP_AI_MODEL:${AI_MODEL:gpt-4o-mini}}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:${AI_TIMEOUT_SECONDS:90}}
    proxy-enabled: ${APP_AI_PROXY_ENABLED:${AI_PROXY_ENABLED:false}}
    proxy-host: ${APP_AI_PROXY_HOST:${AI_PROXY_HOST:127.0.0.1}}
    proxy-port: ${APP_AI_PROXY_PORT:${AI_PROXY_PORT:7890}}
  spec-kit:
    session:
      workspace-root: "/srv/spec-kit/workspaces"
  build-planner:
    max-results-min: 1
    max-results-max: 20
    generate-timeout-seconds: 30
  mhr:
    catalog:
      repository-mode: embedded-json
      import-on-startup: false
      import-json-path: ""
      embedded-json-path: "catalog/mhr-catalog.json"
  expense:
    repository-mode: in-memory
