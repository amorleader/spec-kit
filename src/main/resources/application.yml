spring:
  application:
    name: mhr-build-planner

server:
  port: 8080

app:
  ai:
    mode: "mock"
    base-url: ""
    api-key: ""
    model: "gpt-4o-mini"
    timeout-seconds: 30
    proxy-enabled: false
    proxy-host: "127.0.0.1"
    proxy-port: 7890
  spec-kit:
    session:
      workspace-root: "/srv/spec-kit/workspaces"
  build-planner:
    max-results-min: 1
    max-results-max: 20
    generate-timeout-seconds: 30
  mhr:
    catalog:
      repository-mode: embedded-json
      import-on-startup: false
      import-json-path: ""
      embedded-json-path: "catalog/mhr-catalog.json"
  expense:
    repository-mode: in-memory
