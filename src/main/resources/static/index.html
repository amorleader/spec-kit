<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spec-kit PoC Console</title>
    <style>
        :root {
            --bg-1: #0b1218;
            --bg-2: #18232d;
            --panel: #0f1b24cc;
            --line: #35566b;
            --text: #e7f2fb;
            --muted: #9db6c7;
            --accent: #3dd598;
            --warn: #ffb34d;
            --error: #ff5d73;
            --done: #37c3ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
            background:
                radial-gradient(circle at 10% 8%, #2c7da040 0, transparent 28%),
                radial-gradient(circle at 88% 12%, #3dd59833 0, transparent 30%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
        }

        .app {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 14px 28px;
        }

        .hero {
            padding: 14px 16px;
            border: 1px solid #3f697f;
            border-radius: 14px;
            background: linear-gradient(110deg, #0f2734ba, #14202b90);
            box-shadow: 0 16px 40px #00000040;
        }

        .hero h1 {
            margin: 0;
            letter-spacing: 0.4px;
            font-size: 1.32rem;
        }

        .hero p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .layout {
            margin-top: 14px;
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            backdrop-filter: blur(4px);
            box-shadow: 0 12px 26px #00000033;
            padding: 12px;
        }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 1rem;
        }

        .field {
            margin-bottom: 8px;
        }

        .field label {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 0.83rem;
        }

        .field input,
        .field select,
        .composer textarea,
        .composer button {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #42657b;
            color: var(--text);
            background: #0c1a23;
            padding: 10px;
            font: inherit;
        }

        .field input:focus,
        .field select:focus,
        .composer textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px #3dd59830;
        }

        .btn-row {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr;
        }

        button {
            cursor: pointer;
            transition: transform 0.16s ease, background 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: #102734;
        }

        .create-btn {
            border-color: #45bfeb;
            background: #0f2734;
        }

        .composer textarea {
            resize: vertical;
            min-height: 96px;
        }

        .composer-footer {
            margin-top: 8px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .status-line {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.82rem;
            word-break: break-all;
        }

        .progress {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(3, 1fr);
        }

        .stage {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #446176;
            background: #0f1d27;
            text-align: center;
            font-size: 0.83rem;
            color: var(--muted);
        }

        .stage.done {
            color: #001a24;
            border-color: #63d8ff;
            background: linear-gradient(140deg, #3bc7ff, #84f0ff);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .tab-btn.active {
            border-color: #5dddb5;
            background: #12302a;
            color: #b8f6df;
        }

        pre {
            margin: 0;
            min-height: 260px;
            max-height: 430px;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid #3d5f73;
            background: #08131a;
            color: #c5e7ff;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .timeline {
            display: grid;
            gap: 7px;
            max-height: 250px;
            overflow: auto;
        }

        .event {
            border: 1px solid #3a5d70;
            border-radius: 7px;
            background: #0d1d27;
            padding: 7px;
            font-size: 0.8rem;
        }

        .event .meta {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            margin-bottom: 3px;
            gap: 8px;
        }

        .event .ok { color: var(--accent); }
        .event .fail { color: var(--error); }

        .console {
            margin-top: 8px;
            border: 1px dashed #47687b;
            border-radius: 8px;
            background: #0b1620;
            padding: 8px;
            max-height: 170px;
            overflow: auto;
            font-size: 0.8rem;
            color: #a5c0d3;
        }

        .console div { margin-bottom: 4px; }

        .warn { color: var(--warn); }
        .error { color: var(--error); }

        @media (min-width: 980px) {
            .layout {
                grid-template-columns: 360px 1fr;
            }
            .right-grid {
                display: grid;
                gap: 12px;
                grid-template-rows: auto 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <section class="hero">
        <h1>spec-kit Workflow Console</h1>
        <p>输入你的想法，系统会在后台自动推进分析、方案和任务，并持续更新文档。</p>
    </section>

    <div class="layout">
        <section class="panel">
            <h2>会话控制台</h2>
            <div class="field">
                <label for="projectName">项目名</label>
                <input id="projectName" type="text" value="spec-kit-poc" placeholder="例如: cost-optimizer"/>
            </div>
            <div class="field">
                <label for="objective">目标</label>
                <input id="objective" type="text" value="搭建可视化 spec-kit PoC" placeholder="一句话目标"/>
            </div>
            <div class="btn-row">
                <button class="create-btn" id="createSessionBtn" type="button">新建会话</button>
            </div>
            <div class="status-line" id="sessionStatusLine">尚未创建会话</div>

            <div class="composer" style="margin-top: 10px;">
                <textarea id="chatInput" placeholder="输入本轮增量需求，例如：补充验收标准并补充风险清单"></textarea>
                <div class="composer-footer">
                    <button id="sendBtn" type="button">发送</button>
                </div>
            </div>

            <div class="console" id="chatStream"></div>
        </section>

        <section class="right-grid">
            <div class="panel">
                <h2>项目推进看板</h2>
                <div class="progress">
                    <div class="stage" id="stage-spec">需求理解</div>
                    <div class="stage" id="stage-plan">方案设计</div>
                    <div class="stage" id="stage-tasks">任务落地</div>
                </div>
                <h2 style="margin-top: 12px;">Timeline</h2>
                <div class="timeline" id="timeline"></div>
            </div>

            <div class="panel">
                <h2>文档查看区</h2>
                <div class="tabs">
                    <button class="tab-btn active" type="button" data-doc="spec">spec.md</button>
                    <button class="tab-btn" type="button" data-doc="plan">plan.md</button>
                    <button class="tab-btn" type="button" data-doc="tasks">tasks.md</button>
                </div>
                <pre id="artifactView">会话创建后可查看文档内容</pre>
            </div>
        </section>
    </div>
</div>

<script>
    const state = {
        sessionId: null,
        status: "CREATED",
        activeDoc: "spec",
        artifacts: {
            specMd: "",
            planMd: "",
            tasksMd: "",
            timeline: []
        }
    };

    const stageMap = {
        CREATED: 0,
        SPECIFIED: 1,
        PLANNED: 2,
        TASKS_GENERATED: 3
    };

    const stageEl = {
        spec: document.getElementById("stage-spec"),
        plan: document.getElementById("stage-plan"),
        tasks: document.getElementById("stage-tasks")
    };

    function appendChat(role, message, level) {
        const box = document.getElementById("chatStream");
        const line = document.createElement("div");
        line.textContent = `${role}: ${message}`;
        if (level) {
            line.classList.add(level);
        }
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    function updateStatusBar(maskedPath) {
        const label = document.getElementById("sessionStatusLine");
        if (!state.sessionId) {
            label.textContent = "尚未创建会话";
            return;
        }
        label.textContent = `sessionId=${state.sessionId} | status=${state.status} | workspace=${maskedPath || "***"}`;
    }

    function updateProgress() {
        const rank = stageMap[state.status] || 0;
        stageEl.spec.classList.toggle("done", rank >= 1);
        stageEl.plan.classList.toggle("done", rank >= 2);
        stageEl.tasks.classList.toggle("done", rank >= 3);
    }

    function renderArtifacts() {
        const view = document.getElementById("artifactView");
        const map = {
            spec: state.artifacts.specMd,
            plan: state.artifacts.planMd,
            tasks: state.artifacts.tasksMd
        };
        const value = map[state.activeDoc];
        view.textContent = value || "当前文档为空";
    }

    function renderTimeline() {
        const box = document.getElementById("timeline");
        box.innerHTML = "";
        if (!state.artifacts.timeline || state.artifacts.timeline.length === 0) {
            box.textContent = "暂无 timeline 记录";
            return;
        }

        state.artifacts.timeline.slice().reverse().forEach(event => {
            const item = document.createElement("div");
            item.className = "event";
            const ok = event.result === "success";
            item.innerHTML = `<div class="meta"><span>${event.action}</span><span>${new Date(event.time).toLocaleString()}</span></div>`
                + `<div class="${ok ? "ok" : "fail"}">${event.result}${event.error ? " | " + event.error : ""}</div>`;
            box.appendChild(item);
        });
    }

    async function callApi(url, method, body) {
        const resp = await fetch(url, {
            method,
            headers: {"Content-Type": "application/json"},
            body: body ? JSON.stringify(body) : undefined
        });

        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            const msg = payload.message || `HTTP ${resp.status}`;
            throw new Error(msg);
        }
        return payload;
    }

    async function refreshArtifacts() {
        if (!state.sessionId) {
            return;
        }
        const data = await callApi(`/api/sessions/${encodeURIComponent(state.sessionId)}/artifacts`, "GET");
        state.artifacts = data;
        renderArtifacts();
        renderTimeline();
    }

    document.getElementById("createSessionBtn").addEventListener("click", async () => {
        const projectName = document.getElementById("projectName").value.trim();
        const objective = document.getElementById("objective").value.trim();

        try {
            const data = await callApi("/api/sessions", "POST", { projectName, objective });
            state.sessionId = data.sessionId;
            state.status = data.status;
            state.artifacts = { specMd: "", planMd: "", tasksMd: "", timeline: [] };
            updateStatusBar(data.workspacePath);
            updateProgress();
            renderArtifacts();
            renderTimeline();
            document.getElementById("chatStream").innerHTML = "";
            appendChat("system", `会话创建成功: ${state.sessionId}`);
        } catch (err) {
            appendChat("system", `会话创建失败: ${err.message}`, "error");
        }
    });

    document.getElementById("sendBtn").addEventListener("click", async () => {
        if (!state.sessionId) {
            appendChat("system", "请先创建会话", "warn");
            return;
        }

        const input = document.getElementById("chatInput").value.trim();
        if (!input) {
            appendChat("system", "请输入本轮需求", "warn");
            return;
        }

        appendChat("user", input);
        try {
            const data = await callApi(`/api/sessions/${encodeURIComponent(state.sessionId)}/chat`, "POST", { message: input });
            state.status = data.status;
            updateStatusBar();
            updateProgress();
            await refreshArtifacts();
            appendChat("assistant", data.assistantMessage);
            document.getElementById("chatInput").value = "";
        } catch (err) {
            appendChat("assistant", `处理失败: ${err.message}`, "error");
        }
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(item => item.classList.remove("active"));
            btn.classList.add("active");
            state.activeDoc = btn.getAttribute("data-doc");
            renderArtifacts();
        });
    });

    updateStatusBar();
    updateProgress();
    renderArtifacts();
    renderTimeline();
    appendChat("system", "页面已就绪，等待创建会话");
</script>
</body>
</html>
