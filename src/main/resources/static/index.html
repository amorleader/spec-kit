<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spec-kit Execution Console</title>
    <style>
        :root {
            --bg-1: #07111a;
            --bg-2: #162835;
            --panel: #0f1c26e0;
            --line: #3f6279;
            --text: #e9f4ff;
            --muted: #95b2c7;
            --accent: #48d6b0;
            --warn: #ffc067;
            --error: #ff6f82;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--text);
            font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
            background:
                radial-gradient(circle at 12% 8%, #2684b742 0, transparent 30%),
                radial-gradient(circle at 84% 12%, #3edfa63b 0, transparent 28%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
        }

        .app {
            max-width: 1360px;
            margin: 0 auto;
            padding: 20px 14px 24px;
        }

        .hero {
            border: 1px solid #406a7f;
            border-radius: 14px;
            padding: 14px 16px;
            background: linear-gradient(108deg, #0d2838cc, #1726329c);
        }

        .hero h1 {
            margin: 0;
            font-size: 1.28rem;
        }

        .hero p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .layout {
            margin-top: 12px;
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            box-shadow: 0 12px 24px #00000033;
            padding: 12px;
        }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 1rem;
        }

        .field {
            margin-bottom: 8px;
        }

        .field label {
            display: block;
            color: var(--muted);
            margin-bottom: 4px;
            font-size: 0.82rem;
        }

        .field input,
        .composer textarea,
        button {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #476c80;
            background: #0b1821;
            color: var(--text);
            padding: 10px;
            font: inherit;
        }

        .field input:focus,
        .composer textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px #3dd59830;
        }

        button {
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .status-line {
            color: var(--muted);
            font-size: 0.82rem;
            word-break: break-all;
            margin-top: 8px;
        }

        .workspace-box {
            border: 1px solid #3d5f72;
            border-radius: 8px;
            background: #08141c;
            min-height: 420px;
            max-height: 640px;
            overflow: auto;
            padding: 10px;
        }

        .workspace-empty {
            color: var(--muted);
            font-size: 0.82rem;
        }

        .entry {
            font-size: 0.82rem;
            line-height: 1.55;
            white-space: pre;
        }

        .entry.dir { color: #84e9ff; }
        .entry.file { color: #d7e9f6; }

        .chat-stream {
            border: 1px dashed #4a6d7f;
            border-radius: 8px;
            background: #08131a;
            min-height: 380px;
            max-height: 540px;
            overflow: auto;
            padding: 10px;
            margin-top: 10px;
        }

        .chat-line {
            margin-bottom: 8px;
            font-size: 0.85rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-line.system { color: #8db7cf; }
        .chat-line.user { color: #ffd993; }
        .chat-line.assistant { color: #c6f8e6; }
        .chat-line.warn { color: var(--warn); }
        .chat-line.error { color: var(--error); }

        .composer textarea {
            min-height: 130px;
            resize: vertical;
        }

        .composer button {
            margin-top: 8px;
        }

        .milestone {
            margin-top: 10px;
            border: 1px solid #3d5f72;
            border-radius: 8px;
            background: #08131a;
            max-height: 150px;
            overflow: auto;
            padding: 8px;
            color: var(--muted);
            font-size: 0.78rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #00000088;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal.open { display: flex; }

        .modal-card {
            width: min(560px, 100%);
            border: 1px solid #4b6f82;
            border-radius: 12px;
            background: #0d1f2be8;
            padding: 14px;
        }

        .modal-card h3 {
            margin: 0 0 8px;
        }

        .modal-card p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.5;
        }

        .modal-actions {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr 1fr;
        }

        @media (min-width: 1060px) {
            .layout {
                grid-template-columns: 34% 66%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <section class="hero">
        <h1>spec-kit Delivery Console</h1>
        <p>左侧实时展示服务器工作区文件结构，右侧通过会话推进项目执行。</p>
    </section>

    <div class="layout">
        <section class="panel">
            <h2>工作区文件树</h2>
            <div class="status-line" id="workspaceStatus">尚未绑定会话</div>
            <div class="workspace-box" id="workspaceTree">
                <div class="workspace-empty">创建或恢复会话后展示服务器真实目录结构。</div>
            </div>
            <div class="milestone" id="milestoneView">里程碑文本将在这里显示（按 sessionId 关联）。</div>
        </section>

        <section class="panel">
            <h2>会话对话框</h2>
            <div class="field">
                <label for="projectName">项目名</label>
                <input id="projectName" type="text" value="spec-kit-poc" placeholder="例如: cloud-storage-service"/>
            </div>
            <div class="field">
                <label for="objective">目标</label>
                <input id="objective" type="text" value="搭建可视化 spec-kit PoC" placeholder="一句话描述要做什么"/>
            </div>
            <button id="createSessionBtn" type="button">新建项目会话</button>
            <div class="status-line" id="sessionStatusLine">尚未创建会话</div>

            <div class="chat-stream" id="chatStream"></div>

            <div class="composer">
                <textarea id="chatInput" placeholder="输入需求，例如：先初始化 Maven 工程并创建基础目录"></textarea>
                <button id="sendBtn" type="button">发送</button>
            </div>
        </section>
    </div>
</div>

<div class="modal" id="startupModal">
    <div class="modal-card">
        <h3>继续上次项目？</h3>
        <p id="resumeHint">正在检查上次会话...</p>
        <div class="modal-actions">
            <button id="resumeBtn" type="button">继续上次项目</button>
            <button id="newBtn" type="button">新建项目</button>
        </div>
    </div>
</div>

<script>
    const state = {
        sessionId: null,
        status: "CREATED",
        workspacePath: "",
        latest: null
    };

    function appendChat(role, message, extraClass) {
        const box = document.getElementById("chatStream");
        const line = document.createElement("div");
        line.className = "chat-line " + role + (extraClass ? " " + extraClass : "");
        line.textContent = `${role}: ${message}`;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    async function callApi(url, method, body) {
        const resp = await fetch(url, {
            method,
            headers: {"Content-Type": "application/json"},
            body: body ? JSON.stringify(body) : undefined
        });
        const payload = await resp.json().catch(() => null);
        if (!resp.ok) {
            const msg = payload && payload.message ? payload.message : `HTTP ${resp.status}`;
            throw new Error(msg);
        }
        return payload;
    }

    function updateStatus() {
        const line = document.getElementById("sessionStatusLine");
        const ws = document.getElementById("workspaceStatus");
        if (!state.sessionId) {
            line.textContent = "尚未创建会话";
            ws.textContent = "尚未绑定会话";
            return;
        }
        line.textContent = `sessionId=${state.sessionId} | status=${state.status}`;
        ws.textContent = `workspace=${state.workspacePath || "***"}`;
    }

    function renderTree(entries) {
        const box = document.getElementById("workspaceTree");
        box.innerHTML = "";
        if (!entries || entries.length === 0) {
            box.innerHTML = '<div class="workspace-empty">当前工作区暂无文件。</div>';
            return;
        }
        entries.forEach(item => {
            const line = document.createElement("div");
            line.className = "entry " + (item.directory ? "dir" : "file");
            const indent = "  ".repeat(Math.max(0, item.depth - 1));
            const marker = item.directory ? "[D] " : "[F] ";
            line.textContent = indent + marker + item.path;
            box.appendChild(line);
        });
    }

    async function refreshWorkspace() {
        if (!state.sessionId) {
            return;
        }
        const tree = await callApi(`/api/sessions/${encodeURIComponent(state.sessionId)}/workspace-tree`, "GET");
        renderTree(tree.entries || []);
    }

    async function refreshMilestone() {
        if (!state.sessionId) {
            return;
        }
        const payload = await callApi(`/api/sessions/${encodeURIComponent(state.sessionId)}/milestone`, "GET");
        document.getElementById("milestoneView").textContent = payload.text || "当前会话暂无里程碑文本。";
    }

    async function hydrateSession(session) {
        state.sessionId = session.sessionId;
        state.status = session.status;
        state.workspacePath = session.workspacePath;
        document.getElementById("projectName").value = session.projectName || "";
        document.getElementById("objective").value = session.objective || "";
        localStorage.setItem("speckit.lastSessionId", session.sessionId);
        updateStatus();
        await refreshWorkspace();
        await refreshMilestone();
    }

    async function createSession() {
        const projectName = document.getElementById("projectName").value.trim();
        const objective = document.getElementById("objective").value.trim();
        const data = await callApi("/api/sessions", "POST", {projectName, objective});
        await hydrateSession({
            sessionId: data.sessionId,
            projectName,
            objective,
            status: data.status,
            workspacePath: data.workspacePath
        });
        document.getElementById("chatStream").innerHTML = "";
        appendChat("system", `会话创建成功: ${state.sessionId}`);
    }

    async function sendChat() {
        if (!state.sessionId) {
            appendChat("system", "请先创建或恢复会话", "warn");
            return;
        }
        const input = document.getElementById("chatInput").value.trim();
        if (!input) {
            appendChat("system", "请输入需求", "warn");
            return;
        }
        appendChat("user", input);
        const data = await callApi(`/api/sessions/${encodeURIComponent(state.sessionId)}/chat`, "POST", {message: input});
        state.status = data.status;
        updateStatus();
        appendChat("assistant", data.assistantMessage);
        document.getElementById("chatInput").value = "";
        await refreshWorkspace();
        await refreshMilestone();
    }

    async function loadStartupChoice() {
        const modal = document.getElementById("startupModal");
        const hint = document.getElementById("resumeHint");
        const resumeBtn = document.getElementById("resumeBtn");
        const newBtn = document.getElementById("newBtn");

        let latest = null;
        const lastId = localStorage.getItem("speckit.lastSessionId");
        if (lastId) {
            try {
                latest = await callApi(`/api/sessions/${encodeURIComponent(lastId)}`, "GET");
            } catch (e) {
                latest = null;
            }
        }
        if (!latest) {
            latest = await callApi("/api/sessions/latest", "GET");
        }

        if (!latest || !latest.sessionId) {
            modal.classList.remove("open");
            appendChat("system", "未发现可恢复会话，请创建新项目会话。", "warn");
            return;
        }

        state.latest = latest;
        hint.textContent = `上次会话: ${latest.projectName} | ${latest.status} | ${new Date(latest.createdAt).toLocaleString()}`;
        modal.classList.add("open");

        resumeBtn.onclick = async () => {
            modal.classList.remove("open");
            await hydrateSession(latest);
            appendChat("system", `已恢复会话: ${latest.sessionId}`);
        };

        newBtn.onclick = () => {
            modal.classList.remove("open");
            appendChat("system", "已选择新建项目，请填写项目信息后点击新建。", "warn");
        };
    }

    document.getElementById("createSessionBtn").addEventListener("click", async () => {
        try {
            await createSession();
        } catch (err) {
            appendChat("system", `会话创建失败: ${err.message}`, "error");
        }
    });

    document.getElementById("sendBtn").addEventListener("click", async () => {
        try {
            await sendChat();
        } catch (err) {
            appendChat("assistant", `处理失败: ${err.message}`, "error");
        }
    });

    updateStatus();
    appendChat("system", "页面已就绪。");
    loadStartupChoice().catch(err => {
        appendChat("system", `初始化失败: ${err.message}`, "error");
    });
</script>
</body>
</html>
