<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHR Build Planner MVP</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; margin: 24px; background: #f6f7fb; color: #1f2937; }
        .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
        label { display: block; margin-top: 8px; font-weight: 600; }
        input, select, button { margin-top: 4px; padding: 8px; width: 100%; box-sizing: border-box; }
        button { background: #1d4ed8; border: none; color: white; cursor: pointer; border-radius: 6px; }
        button:hover { background: #1e40af; }
        pre { white-space: pre-wrap; word-break: break-word; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; }
        @media (min-width: 900px) {
            .layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
        }
    </style>
</head>
<body>
<h1>MHR Build Planner MVP</h1>
<div class="layout">
    <div class="card">
        <label for="weapon">Weapon Type</label>
        <select id="weapon">
            <option value="LONG_SWORD">LONG_SWORD</option>
            <option value="GREAT_SWORD">GREAT_SWORD</option>
            <option value="BOW">BOW</option>
        </select>

        <label for="attackBoost">Attack Boost Min Level</label>
        <input id="attackBoost" type="number" value="4" min="1" max="7"/>

        <label for="weaknessExploit">Weakness Exploit Min Level</label>
        <input id="weaknessExploit" type="number" value="3" min="1" max="3"/>

        <label for="maxResults">Max Results</label>
        <input id="maxResults" type="number" value="5" min="1" max="20"/>

        <button id="generateBtn" type="button">Generate Build</button>
    </div>

    <div class="card">
        <h2>Result</h2>
        <pre id="resultBox">No request yet.</pre>
    </div>
</div>

<script>
    const resultBox = document.getElementById('resultBox');

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const payload = {
            weaponType: document.getElementById('weapon').value,
            targetSkills: [
                { skillCode: 'ATTACK_BOOST', minLevel: Number(document.getElementById('attackBoost').value) },
                { skillCode: 'WEAKNESS_EXPLOIT', minLevel: Number(document.getElementById('weaknessExploit').value) }
            ],
            maxResults: Number(document.getElementById('maxResults').value)
        };

        try {
            const res = await fetch('/api/v1/builds/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const json = await res.json();
            resultBox.textContent = JSON.stringify(json, null, 2);
        } catch (e) {
            resultBox.textContent = 'Request failed: ' + e.message;
        }
    });
</script>
</body>
</html>
