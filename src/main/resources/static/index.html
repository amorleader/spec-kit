<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪猎崛起配装助手 MVP</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; margin: 24px; background: #f6f7fb; color: #1f2937; }
        .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
        label { display: block; margin-top: 8px; font-weight: 600; }
        input, select, button { margin-top: 4px; padding: 8px; width: 100%; box-sizing: border-box; }
        .skill-toolbar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
        .selected-skills { margin-top: 10px; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; background: #f9fafb; }
        .selected-skill-item { display: grid; grid-template-columns: 1fr 84px 72px; gap: 8px; align-items: center; margin-bottom: 8px; }
        .selected-skill-item:last-child { margin-bottom: 0; }
        .selected-skill-item input { margin-top: 0; }
        .selected-skill-item button { margin-top: 0; background: #dc2626; }
        .selected-skill-item button:hover { background: #b91c1c; }
        .hint { margin-top: 6px; color: #4b5563; font-size: 12px; }
        button { background: #1d4ed8; border: none; color: white; cursor: pointer; border-radius: 6px; }
        button:hover { background: #1e40af; }
        pre { white-space: pre-wrap; word-break: break-word; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; }
        @media (min-width: 900px) {
            .layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
        }
    </style>
</head>
<body>
<h1>怪猎崛起配装助手 MVP</h1>
<div class="layout">
    <div class="card">
        <label for="weapon">武器类型</label>
        <select id="weapon">
            <option value="LONG_SWORD">太刀</option>
            <option value="GREAT_SWORD">大剑</option>
            <option value="BOW">弓</option>
        </select>

        <label for="skillSearch">目标技能（支持模糊搜索）</label>
        <div class="skill-toolbar">
            <input id="skillSearch" type="text" placeholder="输入技能名/拼音/代码，例如：攻击 看破 ATTACK"/>
            <select id="skillSelect" size="6"></select>
            <input id="selectedSkillPreview" type="text" placeholder="目标技能" readonly/>
            <input id="selectedSkillMinLevel" type="number" value="1" min="1" max="7"/>
            <button id="addSkillBtn" type="button">添加目标技能</button>
        </div>
        <div class="hint">点击下拉项后会回显到“目标技能”，再点击“添加目标技能”。</div>
        <div id="selectedSkills" class="selected-skills"></div>

        <label for="maxResults">最多结果数</label>
        <input id="maxResults" type="number" value="5" min="1" max="20"/>

        <button id="generateBtn" type="button">生成配装</button>
    </div>

    <div class="card">
        <h2>结果</h2>
        <pre id="resultBox">尚未请求，请先点击“生成配装”。</pre>
    </div>
</div>

<script>
    const resultBox = document.getElementById('resultBox');
    const skillSelect = document.getElementById('skillSelect');
    const selectedSkillPreview = document.getElementById('selectedSkillPreview');
    const selectedSkillsBox = document.getElementById('selectedSkills');

    const zhWeapon = {
        LONG_SWORD: '太刀',
        GREAT_SWORD: '大剑',
        BOW: '弓'
    };

    const zhPart = {
        HEAD: '头部',
        CHEST: '胸部',
        ARMS: '手部',
        WAIST: '腰部',
        LEGS: '腿部'
    };

    const zhSkill = {
        ATTACK_BOOST: '攻击强化',
        WEAKNESS_EXPLOIT: '弱点特效',
        CRITICAL_EYE: '看破'
    };

    const skillNameMap = { ...zhSkill };
    const equipmentNameMap = {};
    let allSkills = [];
    let selectedTargetSkills = [];

    const zhReason = {
        out_of_range: '超出允许范围',
        unknown_skill: '未知技能代码',
        exceeds_skill_max: '超过技能最大等级',
        generation_timeout: '生成超时（超过 30 秒）'
    };

    function zWeapon(code) {
        return zhWeapon[code] || code;
    }

    function zPart(code) {
        return zhPart[code] || code;
    }

    function zSkill(code) {
        return skillNameMap[code] || code;
    }

    function zEquipment(name) {
        return equipmentNameMap[name] || name;
    }

    function normalizeText(v) {
        return String(v || '').trim().toLowerCase();
    }

    function skillDisplayName(skill) {
        if (!skill) {
            return '未知技能';
        }
        return skill.nameZh || zSkill(skill.code) || skill.name || skill.code;
    }

    function findSkillByCode(skillCode) {
        return allSkills.find(s => s && s.code === skillCode);
    }

    function normalizeSkillName(skill) {
        return normalizeText((skill && (skill.nameZh || skill.name || skill.code)) || '');
    }

    function dedupeSkillsByName(skills) {
        const map = new Map();
        skills.forEach(skill => {
            if (!skill || !skill.code) {
                return;
            }
            const key = normalizeSkillName(skill);
            const existing = map.get(key);
            if (!existing) {
                map.set(key, skill);
                return;
            }
            const existingMax = Number(existing.maxLevel || 0);
            const currentMax = Number(skill.maxLevel || 0);
            if (currentMax > existingMax) {
                map.set(key, skill);
            }
        });
        return Array.from(map.values());
    }

    function updateSelectedSkillPreview() {
        const skill = findSkillByCode(skillSelect.value);
        selectedSkillPreview.value = skill ? skillDisplayName(skill) : '';
    }

    function updateSkillOptions() {
        const keyword = normalizeText(document.getElementById('skillSearch').value);
        const dedupedSkills = dedupeSkillsByName(allSkills);
        const filtered = dedupedSkills.filter(skill => {
            if (!skill || !skill.code) {
                return false;
            }
            if (!keyword) {
                return true;
            }
            const hitText = [skill.code, skill.name, skill.nameZh].map(normalizeText).join(' ');
            return hitText.includes(keyword);
        });

        skillSelect.innerHTML = '';
        filtered.forEach(skill => {
            const opt = document.createElement('option');
            opt.value = skill.code;
            opt.textContent = `${skillDisplayName(skill)}`;
            skillSelect.appendChild(opt);
        });

        if (skillSelect.options.length > 0) {
            skillSelect.selectedIndex = 0;
        }
        updateSelectedSkillPreview();
    }

    function renderSelectedSkills() {
        if (selectedTargetSkills.length === 0) {
            selectedSkillsBox.textContent = '尚未添加目标技能';
            return;
        }

        selectedSkillsBox.innerHTML = '';
        selectedTargetSkills.forEach((item, index) => {
            const skill = findSkillByCode(item.skillCode);
            const maxLevel = 7;

            const row = document.createElement('div');
            row.className = 'selected-skill-item';

            const label = document.createElement('div');
            label.textContent = `${skillDisplayName(skill)}`;

            const levelInput = document.createElement('input');
            levelInput.type = 'number';
            levelInput.min = '1';
            levelInput.max = String(maxLevel);
            levelInput.value = String(item.minLevel);
            levelInput.addEventListener('change', () => {
                const parsed = Number(levelInput.value);
                const safe = Number.isFinite(parsed) ? Math.max(1, Math.min(maxLevel, parsed)) : 1;
                selectedTargetSkills[index].minLevel = safe;
                levelInput.value = String(safe);
            });

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.textContent = '删除';
            removeBtn.addEventListener('click', () => {
                selectedTargetSkills = selectedTargetSkills.filter((_, i) => i !== index);
                renderSelectedSkills();
            });

            row.appendChild(label);
            row.appendChild(levelInput);
            row.appendChild(removeBtn);
            selectedSkillsBox.appendChild(row);
        });
    }

    function addSelectedSkill() {
        const skillCode = skillSelect.value;
        if (!skillCode) {
            resultBox.textContent = '请先从下拉列表选择一个技能。';
            return;
        }

        if (selectedTargetSkills.some(s => s.skillCode === skillCode)) {
            resultBox.textContent = '该技能已添加，请直接在列表中修改等级。';
            return;
        }

        const skill = findSkillByCode(skillCode);
        const rawMin = Number(document.getElementById('selectedSkillMinLevel').value);
        const maxLevel = 7;
        const minLevel = Number.isFinite(rawMin) ? Math.max(1, Math.min(maxLevel, rawMin)) : 1;

        selectedTargetSkills.push({ skillCode, minLevel });
        renderSelectedSkills();
    }

    function ensureDefaultTargetSkills() {
        if (selectedTargetSkills.length > 0) {
            return;
        }
        const defaults = [
            { skillCode: 'ATTACK_BOOST', minLevel: 4 },
            { skillCode: 'WEAKNESS_EXPLOIT', minLevel: 3 }
        ];
        defaults.forEach(d => {
            const skill = findSkillByCode(d.skillCode);
            if (!skill) {
                return;
            }
            const maxLevel = skill.maxLevel || d.minLevel;
            selectedTargetSkills.push({
                skillCode: d.skillCode,
                minLevel: Math.max(1, Math.min(maxLevel, d.minLevel))
            });
        });
        renderSelectedSkills();
    }

    async function loadLocalizationData(weaponType) {
        try {
            const [skillsRes, equipmentRes] = await Promise.all([
                fetch('/api/v1/skills'),
                fetch(`/api/v1/equipments?weaponType=${encodeURIComponent(weaponType)}`)
            ]);

            if (skillsRes.ok) {
                const skills = await skillsRes.json();
                if (Array.isArray(skills)) {
                    allSkills = skills;
                    skills.forEach(skill => {
                        if (skill && skill.code && skill.nameZh) {
                            skillNameMap[skill.code] = skill.nameZh;
                        }
                    });
                    updateSkillOptions();
                    ensureDefaultTargetSkills();
                }
            }

            if (equipmentRes.ok) {
                const equipments = await equipmentRes.json();
                if (Array.isArray(equipments)) {
                    equipments.forEach(equip => {
                        if (equip && equip.name && equip.nameZh) {
                            equipmentNameMap[equip.name] = equip.nameZh;
                        }
                    });
                }
            }
        } catch (e) {
            // Localization fetch failure should not block core build generation.
        }
    }

    function formatSkills(skillPoints) {
        if (!skillPoints || Object.keys(skillPoints).length === 0) {
            return '无';
        }
        return Object.entries(skillPoints)
            .map(([code, level]) => `${zSkill(code)} Lv${level}`)
            .join('，');
    }

    function formatSlotSummary(slotSummary) {
        if (!slotSummary || Object.keys(slotSummary).length === 0) {
            return '无';
        }
        return Object.entries(slotSummary)
            .sort((a, b) => Number(a[0]) - Number(b[0]))
            .map(([slotLevel, count]) => `${slotLevel}级孔 x ${count}`)
            .join('，');
    }

    function renderResult(json, requestPayload) {
        const lines = [];
        lines.push(`武器类型：${zWeapon(requestPayload.weaponType)}（${requestPayload.weaponType}）`);
        lines.push(`目标技能：${requestPayload.targetSkills.map(s => `${zSkill(s.skillCode)} Lv${s.minLevel}`).join('，')}`);
        lines.push(`结果上限：${requestPayload.maxResults}`);
        lines.push('');

        const results = json && Array.isArray(json.results) ? json.results : [];
        if (results.length === 0) {
            lines.push('未找到满足条件的配装结果。');
            return lines.join('\n');
        }

        lines.push(`共找到 ${results.length} 套配装：`);
        lines.push('');

        results.forEach((r, index) => {
            lines.push(`【方案 ${index + 1}】ID: ${r.id || 'N/A'}，评分: ${r.score}`);
            lines.push('装备：');

            const equipmentSet = r.equipmentSet || {};
            Object.entries(equipmentSet).forEach(([part, equip]) => {
                const displayName = equip && (equip.nameZh || equip.name)
                    ? (equip.nameZh || zEquipment(equip.name))
                    : '未知装备';
                const rawName = equip && equip.name ? `（${equip.name}）` : '';
                const rarity = equip && equip.rarity ? `，稀有度 R${equip.rarity}` : '';
                const slots = equip && Array.isArray(equip.slots) && equip.slots.length > 0
                    ? `，插槽 ${equip.slots.join('/')}`
                    : '，插槽 无';
                const skills = equip ? formatSkills(equip.skillPoints) : '无';

                lines.push(`- ${zPart(part)}: ${displayName}${rawName}${rarity}${slots}`);
                lines.push(`  技能：${skills}`);
            });

            lines.push(`总技能：${formatSkills(r.totalSkills)}`);
            lines.push(`孔位汇总：${formatSlotSummary(r.slotSummary)}`);
            lines.push('');
        });

        return lines.join('\n');
    }

    function renderErrorMessage(json, status) {
        if (!json || typeof json !== 'object') {
            return `请求失败（HTTP ${status}）。`;
        }

        const details = Array.isArray(json.details) ? json.details : [];
        const detailText = details.length === 0
            ? '无详细错误信息'
            : details.map(d => `${d.field || 'unknown'}: ${zhReason[d.reason] || d.reason || '未知原因'}`).join('；');

        return `请求失败（HTTP ${status}）\n错误码：${json.code || 'N/A'}\n错误信息：${json.message || 'N/A'}\n详细：${detailText}`;
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const weaponType = document.getElementById('weapon').value;
        await loadLocalizationData(weaponType);

        if (selectedTargetSkills.length === 0) {
            resultBox.textContent = '请至少添加 1 个目标技能。';
            return;
        }

        const payload = {
            weaponType,
            targetSkills: selectedTargetSkills.map(s => ({ skillCode: s.skillCode, minLevel: s.minLevel })),
            maxResults: Number(document.getElementById('maxResults').value)
        };

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30_000);

        try {
            const res = await fetch('/api/v1/builds/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            const json = await res.json();

            if (!res.ok) {
                resultBox.textContent = renderErrorMessage(json, res.status);
                return;
            }

            resultBox.textContent = renderResult(json, payload);
        } catch (e) {
            clearTimeout(timeoutId);
            if (e && e.name === 'AbortError') {
                resultBox.textContent = '请求超时：生成配装超过 30 秒，已自动取消。请缩小技能条件或结果数量后重试。';
                return;
            }
            resultBox.textContent = '请求失败：' + e.message;
        }
    });

    document.getElementById('weapon').addEventListener('change', async (event) => {
        await loadLocalizationData(event.target.value);
    });

    document.getElementById('skillSearch').addEventListener('input', updateSkillOptions);
    document.getElementById('addSkillBtn').addEventListener('click', addSelectedSkill);
    skillSelect.addEventListener('change', updateSelectedSkillPreview);
    skillSelect.addEventListener('dblclick', addSelectedSkill);
    renderSelectedSkills();

    loadLocalizationData(document.getElementById('weapon').value);
</script>
</body>
</html>
