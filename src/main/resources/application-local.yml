spring:
  datasource:
    url: jdbc:postgresql://${MHR_DB_HOST:localhost}:${MHR_DB_PORT:5432}/${MHR_DB_NAME:speckit_mhr}
    username: ${MHR_DB_USER:mhr_user}
    password: ${MHR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

app:
  mhr:
    catalog:
      repository-mode: db
      import-on-startup: false
      import-json-path: ""
  expense:
    repository-mode: db
